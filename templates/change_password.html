<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change password</title>
</head>
<body>
    <h1>Change password</h1>
    <form action="/change_password" method="post">
        <label>
            New password
            <input type="text" name="new_password">
        </label>
        <br>
        <label>
            Confirm password
            <input type="text" name="new_password_repeat">
        </label>
        <br>
        <input type="submit" value="Update">
    </form>
</body>
</html>
